<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Power-Up Consolidado</title>
    <!-- Carrega a API do Trello -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f5f7; }
        .hidden { display: none; }
        /* Adicionada a classe setting-row para organizar as configurações */
        .setting-row { display: flex; align-items: center; justify-content: space-between; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        input:checked + .slider { background-color: #0079bf; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

    <!-- Interface visível apenas se for popup de configurações -->
    <div id="settings-ui" class="hidden">
        
        <div class="setting-row">
            <span>Mostrar descrições:</span>
            <label class="switch">
                <input type="checkbox" id="toggleSwitch">
                <span class="slider"></span>
            </label>
        </div>
        
        <div class="setting-row">
            <span>Número de Linhas:</span>
            <select id="numLinesSelect" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="1">1 Linha</option>
                <option value="2">2 Linhas</option>
                <option value="3">3 Linhas</option>
                <option value="4">4 Linhas</option>
                <option value="5">5 Linhas</option>
            </select>
        </div>

    </div>

    <script>
        var t = window.TrelloPowerUp.iframe();

        // 1. Configurações do Power-Up
        window.TrelloPowerUp.initialize({
            'board-buttons': function(t) {
                return [{
                    text: 'Configurações',
                    callback: function(t) {
                        return t.popup({
                            title: 'Configurações',
                            url: './index.html?settings=true',
                            height: 160 /* Altura aumentada para caber o novo menu */
                        });
                    }
                }];
            },
            'card-badges': function(t) {
                // Lemos as duas configurações ao mesmo tempo (O botão de ligar e o número de linhas)
                return Promise.all([
                    t.get('board', 'shared', 'showDescriptions', false),
                    t.get('board', 'shared', 'numLines', 1)
                ]).then(function(values) {
                    const showDescriptions = values[0];
                    const numLines = parseInt(values[1], 10);

                    if (!showDescriptions) return [];
                    
                    return t.card('desc').then(function(card) {
                        if (!card.desc || card.desc.trim() === '') return [];
                        
                        // Divide o texto por quebras de linha (ENTER = \n)
                        let linhas = card.desc.split('\n');
                        
                        // Limpa os textos e remove as linhas que o usuário deixou vazias
                        let linhasValidas = linhas.map(l => l.replace(/[`*#_~>]/g, "").trim()).filter(l => l.length > 0);
                        
                        // Pega apenas a quantidade configurada no painel
                        let linhasParaMostrar = linhasValidas.slice(0, numLines);
                        
                        // Retorna um Array com UM BADGE para cada linha, criando o efeito de lista!
                        return linhasParaMostrar.map(function(linha) {
                            let preview = linha.length > 35 ? linha.substring(0, 32) + '...' : linha;
                            return { text: preview, color: 'blue' };
                        });
                    });
                });
            }
        });

        // 2. Lógica para exibir a interface apenas no popup
        if (window.location.search.includes('settings=true')) {
            document.getElementById('settings-ui').classList.remove('hidden');
            
            // Puxa os dados salvos quando o painel abre
            Promise.all([
                t.get('board', 'shared', 'showDescriptions', false),
                t.get('board', 'shared', 'numLines', 1)
            ]).then(function(values) {
                document.getElementById('toggleSwitch').checked = values[0];
                document.getElementById('numLinesSelect').value = values[1];
            });

            // Salva quando clica no botão Liga/Desliga
            document.getElementById('toggleSwitch').addEventListener('change', function(e) {
                t.set('board', 'shared', 'showDescriptions', e.target.checked);
            });

            // Salva quando escolhe a quantidade de linhas
            document.getElementById('numLinesSelect').addEventListener('change', function(e) {
                t.set('board', 'shared', 'numLines', parseInt(e.target.value, 10));
            });
        }
    </script>
</body>
</html>
